[pytest]
pythonpath = .
testpaths = tests

# Test categories, so a run can be scoped deliberately rather than by filename:
#
#   pytest -m "not integration"   everything that needs no external service
#   pytest -m integration         only the live Neo4j suites
#
# Integration tests skip themselves when no server is reachable; the marker is
# what lets a run assert *which* tests were skipped and why.
markers =
    integration: requires a reachable Neo4j server (see docs/DEVELOPMENT.md)
