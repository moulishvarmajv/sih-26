services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # Empty outside production, where an ephemeral key is generated per
      # process. Passed through so a production run has a way to supply one:
      # without it the container would fail startup with no remedy.
      - SECRET_KEY=${SECRET_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-shadowintel}
      - NEO4J_DATABASE=neo4j
    volumes:
      # SQLite databases and the evidence object store. Local files, so the
      # investigation survives a container rebuild.
      - ./data:/app/data
    depends_on:
      neo4j:
        # The backend starts regardless of graph health; waiting here just avoids
        # noisy retries during local startup.
        condition: service_healthy
    healthcheck:
      # Deliberately /health and not /ready: neither probes Neo4j, because the
      # application is designed to serve every non-graph route with the graph
      # down. Uses the stdlib, so the image needs no curl.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  neo4j:
    image: neo4j:5-community
    environment:
      # Development default only. Override NEO4J_PASSWORD in the environment or
      # a local .env file; never commit a real credential.
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-shadowintel}
      - NEO4J_server_memory_heap_max__size=512M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-shadowintel}
          "RETURN 1" || exit 1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
